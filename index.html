<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f13" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="댄스 리플레이" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>댄스 리플레이</title>
  </head>
  <body>
    <main id="app">
      <section class="load">
        <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="유튜브 링크 붙여넣기" />
        <button id="paste" class="btn primary">붙여넣기</button>
        <label class="btn" title="내 파일 열기">
          파일
          <input id="file" type="file" accept="audio/*,video/*" hidden />
        </label>
      </section>

      <div id="notice" class="notice" hidden></div>

      <div id="stageWrap" class="stage-wrap empty">
        <div id="stage" class="stage"></div>
        <div class="stage-empty">링크를 붙여넣거나 파일을 열어주세요</div>
        <div id="countBig" class="count-big" hidden></div>
      </div>
      <div class="title-row">
        <div id="title" class="song-title"></div>
        <button id="star" class="btn icon" aria-label="곡 저장" aria-pressed="false" disabled>☆</button>
        <button id="mirror" class="btn icon" aria-label="거울 모드" aria-pressed="false">⇋</button>
        <button id="wake" class="btn icon" aria-label="화면 켜두기" aria-pressed="false" hidden>☀</button>
      </div>

      <section class="seek">
        <div class="seek-track">
          <div id="abRange" class="ab-range" hidden></div>
          <div id="progress" class="progress"></div>
          <input id="seekbar" type="range" min="0" max="0" step="0.1" value="0" aria-label="재생 위치" />
        </div>
        <div class="times">
          <span id="cur" class="mono">0:00.0</span>
          <span id="count" class="count" hidden></span>
          <span id="dur" class="mono">0:00</span>
        </div>
      </section>

      <section class="transport">
        <button class="btn big" data-act="back5" aria-label="5초 뒤로">−5s</button>
        <button id="play" class="btn huge primary" aria-label="재생">▶</button>
        <button class="btn big" data-act="fwd5" aria-label="5초 앞으로">+5s</button>
      </section>

      <section class="ab">
        <div class="ab-col">
          <button id="btnA" class="btn ab-btn">A</button>
          <div id="timeA" class="mono ab-time">--:--</div>
          <div class="nudge">
            <button class="btn" data-nudge="a" data-d="-0.1">−0.1</button>
            <button class="btn" data-nudge="a" data-d="0.1">+0.1</button>
          </div>
        </div>
        <div class="ab-mid">
          <button id="loop" class="btn loop-btn" aria-pressed="false">반복<br /><small>OFF</small></button>
          <button id="clearAB" class="btn small">지우기</button>
        </div>
        <div class="ab-col">
          <button id="btnB" class="btn ab-btn">B</button>
          <div id="timeB" class="mono ab-time">--:--</div>
          <div class="nudge">
            <button class="btn" data-nudge="b" data-d="-0.1">−0.1</button>
            <button class="btn" data-nudge="b" data-d="0.1">+0.1</button>
          </div>
        </div>
      </section>

      <section class="speed">
        <div class="speed-main">
          <button id="rateDown" class="btn big" aria-label="0.05 느리게">−</button>
          <button id="rateVal" class="rate-val mono" title="1.0x로 되돌리기">1.00x</button>
          <button id="rateUp" class="btn big" aria-label="0.05 빠르게">+</button>
        </div>
        <div id="rates" class="chips"></div>
        <div id="rateNote" class="hint"></div>
      </section>

      <nav class="tabs" role="tablist">
        <button class="tab on" data-tab="sections" role="tab">구간</button>
        <button class="tab" data-tab="count" role="tab">카운트</button>
        <button class="tab" data-tab="library" role="tab">곡 목록</button>
      </nav>

      <section id="tab-sections" class="panel">
        <div id="sectionList" class="list"></div>
        <div class="hint">A·B를 찍은 뒤 이름을 눌러 구간 저장</div>
        <div id="sectionNames" class="chips wrap"></div>
      </section>

      <section id="tab-count" class="panel" hidden>
        <div class="bpm-row">
          <button id="tap" class="btn big tap-btn">탭</button>
          <div class="bpm-box">
            <div id="bpm" class="bpm mono">--</div>
            <div class="hint">BPM (원곡 기준)</div>
          </div>
          <div class="bpm-adj">
            <button id="bpmUp" class="btn">+1</button>
            <button id="bpmDown" class="btn">−1</button>
          </div>
        </div>
        <div class="hint">박자에 맞춰 탭을 4번 이상. 느린 배속에서 탭해도 원곡 BPM으로 환산돼요.</div>
        <button id="setOne" class="btn">지금 위치를 "1"로</button>
        <div class="toggles">
          <button id="showCount" class="btn" aria-pressed="false">8카운트 표시</button>
          <button id="countIn" class="btn" aria-pressed="false">카운트인 5·6·7·8</button>
        </div>
      </section>

      <section id="tab-library" class="panel" hidden>
        <div class="seg">
          <button class="btn small on" data-filter="recent">최근</button>
          <button class="btn small" data-filter="saved">저장됨 ★</button>
        </div>
        <div id="songList" class="list"></div>
      </section>
    </main>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
